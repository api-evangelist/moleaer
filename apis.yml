aid: moleaer
name: Moleaer
description: 'Moleaer Inc. is a Hawthorne, California nanobubble technology company
  that designs and manufactures nanobubble generators — Clear, Bloom, Lotus, Neo, Nexus,
  Trinity, Freya, Indalo, Titan and XTB, plus the NanoShield service — used to raise
  dissolved oxygen, act as a chemical-free oxidant, and control algae and biofilm in
  aquaculture, horticulture and irrigation water, lakes and ponds, wastewater treatment,
  food and beverage, car washes, mining, and oil and gas. Its only digital surface is
  a customer-only remote monitoring service, launched in 2020 with industrial IoT
  provider AMI Global, that reports equipment status and water-quality readings (DO,
  pH, ORP, temperature, conductivity) into a login-gated portal at
  www.monitoring-moleaer.com. Moleaer publishes no public API, SDK, developer portal
  or machine-readable specification; equipment-level integration is offered through
  industrial control protocols (SCADA/Modbus/EtherNet-IP) on the generators themselves,
  not through a web API.'
